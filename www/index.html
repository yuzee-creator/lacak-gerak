const rg=(n,o,k,a,b)=>`<label>${n}<input type=range min=${a} max=${b} value=${o[k]} oninput="${o===A?`A['${k}']=+this.value`:`sp('${k}',+this.value)`}"></label>`;

async function aud(sp,dur){let r=null;try{const ac=new (window.AudioContext||window.webkitAudioContext)(),ab=await ac.decodeAudioData(await (await fetch(v.src)).arrayBuffer());ac.close();const ch=Math.min(2,ab.numberOfChannels),oc=new OfflineAudioContext(ch,Math.ceil(dur/sp*ab.sampleRate),ab.sampleRate),s=oc.createBufferSource();s.buffer=ab;s.playbackRate.value=sp;s.connect(oc.destination);s.start();r=await oc.startRendering()}catch(e){return null}
 if(!(window.AudioEncoder&&(await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:r.sampleRate,numberOfChannels:r.numberOfChannels,bitrate:128000})).supported))throw 'aac';return r}
async function encAud(mx,r){const ch=r.numberOfChannels,sr=r.sampleRate,len=r.length,enc=new AudioEncoder({output:(c,m)=>mx.addAudioChunk(c,m),error:console.error});enc.configure({codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:ch,bitrate:128000});const N=4096;for(let o=0;o<len;o+=N){const m=Math.min(N,len-o),d=new Float32Array(m*ch);for(let c=0;c<ch;c++)d.set(r.getChannelData(c).subarray(o,o+m),c*m);const a=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:m,numberOfChannels:ch,timestamp:Math.round(o/sr*1e6),data:d});enc.encode(a);a.close()}await enc.flush()}
async function expHQ(){const fps=+$('#fps').value,bt=+$('#bt').value*1e6,dur=v.duration,sp=A.sp/100,n=Math.floor(dur/sp*fps);v.pause();BUSY=1;REC=2;
 try{expSz();const ow=cv.width,oh=cv.height;let cfg=null;
  for(const c of ['avc1.640028','avc1.4d0028','avc1.42E01F']){const o={codec:c,width:ow,height:oh,bitrate:bt,framerate:fps};if((await VideoEncoder.isConfigSupported(o)).supported){cfg=o;break}}
  if(!cfg)throw 'avc';msg('Menyiapkan audio…');const au=await aud(sp,dur);
  const mx=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:ow,height:oh},audio:au?{codec:'aac',sampleRate:au.sampleRate,numberOfChannels:au.numberOfChannels}:undefined,fastStart:'in-memory'});
  let err=null;const ve=new VideoEncoder({output:(c,m)=>mx.addVideoChunk(c,m),error:e=>err=e});ve.configure(cfg);const t0=performance.now();
  for(let i=0;i<n;i++){if(err)throw err;await seek(i/fps*sp);draw();const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps)});ve.encode(f,{keyFrame:i%(fps*2)==0});f.close();while(ve.encodeQueueSize>6)await new Promise(r=>setTimeout(r,4));
   if(i%4==0){const el=(performance.now()-t0)/1e3;msg(`Ekspor ${Math.round(i/n*100)}% · sisa ±${Math.round(el/(i+1)*(n-i))} dtk`)}}
  await ve.flush();if(au)await encAud(mx,au);mx.finalize();
  OUT={blob:new Blob([mx.target.buffer],{type:'video/mp4'}),name:'lacak-gerak-'+Date.now()+'.mp4'};
  BUSY=0;REC=0;setPQ();dl();ui();msg('Selesai! Tekan Simpan ke Galeri')
 }catch(e){BUSY=0;REC=0;setPQ();msg('Mode halus gagal ('+(e&&e.message||e)+'), pakai mode rekam…');expRT()}}
